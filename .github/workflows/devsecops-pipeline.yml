name: Dynamic DevSecOps Pipeline

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  devsecops-pipeline:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Display Pipeline Start
        run: echo "Starting Dynamic DevSecOps Pipeline"

      - name: List Repository Files
        run: ls -la

      - name: Run Dynamic Technology Detection
        shell: pwsh
        run: |
          ./scripts/detect-tech.ps1

      - name: Pipeline Completion Message
        run: echo "Dynamic Detection Completed Successfully"